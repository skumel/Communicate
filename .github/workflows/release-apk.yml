name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Prepare APK artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk Communicate-v1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk Communicate-v1.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Communicate-APK
          path: |
            Communicate-v1.0.apk
            Communicate-v1.0-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Communicate v1.0
          body: |
            ### Communicate v1.0 — Offline E-Bike Communicator & Telemetry
            Download and install **`Communicate-v1.0.apk`** on your Android device (Android 8.0+ / API 26+).
          files: |
            Communicate-v1.0.apk
            Communicate-v1.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
